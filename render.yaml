services:
  - type: web
    name: suftrip
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:runtime && npm run start:public
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_AUTH
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: suftrip-db
          property: connectionString
      - key: INTERNAL_API_PORT
        value: "3001"

  - type: web
    name: suftrip-web
    runtime: static
    plan: free
    buildCommand: echo "Suftrip frontend is served by the API web service; this static service is optional."
    staticPublishPath: ./web
    autoDeploy: true

databases:
  - name: suftrip-db
    plan: free
    region: frankfurt
    databaseName: suftrip
    user: suftrip
