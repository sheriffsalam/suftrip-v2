services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suftrip
      POSTGRES_USER: suftrip
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suftrip -d suftrip"]
      interval: 2s
      timeout: 3s
      retries: 15
