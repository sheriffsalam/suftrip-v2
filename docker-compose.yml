services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suftrip
      POSTGRES_USER: suftrip
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suftrip -d suftrip"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://suftrip:development-only@postgres:5432/suftrip
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/src/infrastructure/persistence/postgres/migrate.js"]
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgres://suftrip:development-only@postgres:5432/suftrip
      AUTH_SECRET: replace-with-a-random-secret-at-least-32-characters
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/src/http/server.js"]

  outbox-worker:
    build: .
    environment:
      DATABASE_URL: postgres://suftrip:development-only@postgres:5432/suftrip
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/src/infrastructure/outbox/run-outbox-worker.js"]

  notification-worker:
    build: .
    environment:
      DATABASE_URL: postgres://suftrip:development-only@postgres:5432/suftrip
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/src/infrastructure/notifications/run-notification-delivery-worker.js"]
